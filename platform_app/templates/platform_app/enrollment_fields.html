<label for="study-group">{{ t.study_group }}</label><select id="study-group" name="study_group"><option value="">{{ t.no_study_group }}</option>{% for group in study_groups %}<option value="{{ group.pk }}" {% if request.POST.study_group == group.pk|stringformat:'s' %}selected{% endif %}>{{ group.programme }} · {{ t.cur_group }} {{ group.group_number }}</option>{% endfor %}</select><label for="enrollment-code">{{ t.cur_enrollment_code }}</label><input id="enrollment-code" name="enrollment_code" maxlength="80" autocomplete="off" spellcheck="false" aria-describedby="enrollment-hint"><p class="help" id="enrollment-hint">{{ t.enrollment_hint }}</p>

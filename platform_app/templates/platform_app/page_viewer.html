{% load static %}<!doctype html><html lang="{{ interface_language }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ t.page }} {{ page_number }} · {{ t.preview }}</title><link rel="stylesheet" href="{% static 'platform_app/page_viewer.css' %}?v={{ app_version }}"><script src="{% static 'platform_app/page_viewer.js' %}?v={{ app_version }}" defer></script></head>
<body><nav class="page-tools" aria-label="{{ t.preview }}">{% if previous_url %}<a href="{{ previous_url }}" aria-label="{{ t.previous_page }}">←</a>{% else %}<span>←</span>{% endif %}<form action="{{ viewer_url }}" method="get"><label for="page">{{ t.page }}</label><input id="page" name="page" inputmode="numeric" type="number" min="1" max="{{ page_count }}" value="{{ page_number }}" required><span>/ {{ page_count }}</span><button type="submit">{{ t.go_page }}</button></form>{% if next_url %}<a href="{{ next_url }}" aria-label="{{ t.next_page }}">→</a>{% else %}<span>→</span>{% endif %}<label class="zoom-label" for="zoom">{{ t.zoom }}</label><select id="zoom"><option value="100">100%</option><option value="125">125%</option><option value="150">150%</option><option value="200">200%</option></select></nav>
<p class="page-legend"><mark>{{ t.yellow_errors }}</mark>{% if chosen_rule %}<span> · {{ chosen_rule }}</span>{% endif %}</p><p id="viewer-status" role="status" aria-live="polite">{{ t.loading_page }}</p><a id="viewer-retry" href="" hidden>{{ t.retry_page }}</a>
<div class="page-sheet"><img id="page-image" data-image-url="{{ image_url }}" data-error="{{ t.viewer_unavailable }}" data-no-marks="{{ t.no_line_location }}" alt="{{ t.page }} {{ page_number }} · {{ t.yellow_errors }}"><noscript><img src="{{ image_url }}" alt="{{ t.page }} {{ page_number }}"></noscript></div></body></html>
